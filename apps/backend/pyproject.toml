[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.4",
  "fastapi>=0.136.1",
  "loguru>=0.7.3",
  "pydantic>=2.13.3",
  "pydantic-settings>=2.14.0",
  "python-multipart>=0.0.29",
  "sqlalchemy>=2.0.49",
  "uvicorn>=0.46.0",
  "chromadb>=1.5.9",
  "langchain>=1.3.0",
  "langchain-community>=0.4.1",
  "langchain-chroma>=1.1.0",
  "langchain-ollama>=1.1.0",
  "ollama>=0.6.2",
  "pypdf>=6.11.0",
  "faster-whisper>=1.2.1",
  "piper-tts>=1.4.2",
]

[tool.ruff]
line-length = 120
target-version = "py314"
indent-width = 4

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
indent-style = "tab"
quote-style = "double"

[tool.pyright]
venvPath = "."
venv = ".venv"
