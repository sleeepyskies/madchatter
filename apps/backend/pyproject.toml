[project]
name = "madchatter-server"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.29",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
    # ---- Chat ----
    "websockets>=16.0",
    "chromadb>=1.5.9",
    "langchain>=1.3.0",
    "langchain-community>=0.4.1",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.2",
    "pypdf>=6.11.0",
    "faster-whisper>=1.2.1",
    "piper-tts>=1.4.2",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.18",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]
mypy_path = "apps/backend/src"
explicit_package_bases = true
implicit_reexport = true
ignore_missing_imports = true

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
